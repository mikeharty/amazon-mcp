name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / Postgres / Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: amazon_mcp
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: amazon_mcp
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U amazon_mcp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://amazon_mcp:local-development-only@127.0.0.1:55432/amazon_mcp
      AMAZON_LIVE_ENABLED: "false"
      RETAIN_OBSERVATIONS: "false"
      KEEPA_ENABLED: "false"
      DESKTOP_NOTIFICATIONS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run verify
      - name: Fresh setup, migration, and MCP discovery (no Amazon access)
        shell: bash
        run: |
          set -euo pipefail
          pnpm run local:init
          pnpm run migrate
          node --env-file=.env dist/apps/gateway/main.js &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3433/health > /dev/null; then
              ready=true
              break
            fi
            kill -0 "$gateway_pid"
            sleep 1
          done
          test "$ready" = true
          pnpm run mcp:smoke
      - run: pnpm audit --prod

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download and verify pinned Gitleaks
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --output gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan without printing secret values
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact=100'
